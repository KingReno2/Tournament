<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FX Pulse — Backtester</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin:0; background:#0B0E13; color:#E9EDF3; font-family:'JetBrains Mono',monospace; }
  .fp-display { font-family:'Space Grotesk',sans-serif; }
  .fp-input { background:#12161D; border:1px solid #232A34; color:#E9EDF3; border-radius:6px; padding:9px 11px; font-family:'JetBrains Mono',monospace; font-size:13px; outline:none; }
  .fp-input:focus { border-color:#E8A33D; }
  .fp-btn { background:#E8A33D; color:#0B0E13; border:none; border-radius:6px; padding:10px 18px; font-weight:700; font-family:'Space Grotesk',sans-serif; cursor:pointer; font-size:13px; }
  .fp-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .fp-panel { background:#12161D; border:1px solid #1E242D; border-radius:10px; }
  @media (max-width:760px){ .fp-grid { grid-template-columns:1fr !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useCallback } = React;

const TF_CONFIG = [
  { key: "15min", label: "15M", weight: 0.15, points: 500 },
  { key: "1h", label: "1H", weight: 0.25, points: 500 },
  { key: "4h", label: "4H", weight: 0.30, points: 300 },
  { key: "1day", label: "1D", weight: 0.30, points: 200 },
];

// ---------- exact same indicator math as the live tool ----------
function ema(values, period) {
  const k = 2 / (period + 1);
  const out = [];
  let prev;
  values.forEach((v, i) => { prev = i === 0 ? v : v * k + prev * (1 - k); out.push(prev); });
  return out;
}
function rsi(closes, period = 14) {
  const out = new Array(closes.length).fill(null);
  if (closes.length <= period) return out;
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i - 1];
    if (d >= 0) gains += d; else losses -= d;
  }
  let avgGain = gains / period, avgLoss = losses / period;
  out[period] = 100 - 100 / (1 + (avgLoss === 0 ? 100 : avgGain / avgLoss));
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    const g = d > 0 ? d : 0, l = d < 0 ? -d : 0;
    avgGain = (avgGain * (period - 1) + g) / period;
    avgLoss = (avgLoss * (period - 1) + l) / period;
    const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
    out[i] = 100 - 100 / (1 + rs);
  }
  return out;
}
function macdHist(closes) {
  const e12 = ema(closes, 12), e26 = ema(closes, 26);
  const macdLine = closes.map((_, i) => e12[i] - e26[i]);
  const signal = ema(macdLine, 9);
  return macdLine.map((v, i) => v - signal[i]);
}
function atr(candles, period = 14) {
  const trs = candles.map((c, i) => {
    if (i === 0) return c.high - c.low;
    const pc = candles[i - 1].close;
    return Math.max(c.high - c.low, Math.abs(c.high - pc), Math.abs(c.low - pc));
  });
  const out = [];
  let sum = 0;
  trs.forEach((tr, i) => {
    if (i < period) { sum += tr; out.push(i === period - 1 ? sum / period : null); }
    else { const prev = out[i - 1] ?? tr; out.push((prev * (period - 1) + tr) / period); }
  });
  return out;
}
function analyzeCandles(candles) {
  const closes = candles.map((c) => c.close);
  const e20 = ema(closes, 20), e50 = ema(closes, 50);
  const rsiArr = rsi(closes, 14);
  const hist = macdHist(closes);
  const atrArr = atr(candles, 14);
  const last = closes.length - 1;
  const price = closes[last];
  const emaFast = e20[last], emaSlow = e50[last];
  const rsiVal = rsiArr[last] ?? 50;
  const histVal = hist[last] ?? 0;
  const histPrev = hist[last - 1] ?? histVal;
  const atrVal = atrArr[last] ?? 0;
  let score = 0;
  score += price > emaFast ? 0.25 : -0.25;
  score += emaFast > emaSlow ? 0.25 : -0.25;
  score += histVal > 0 ? 0.25 : -0.25;
  score += rsiVal > 55 ? 0.25 : rsiVal < 45 ? -0.25 : 0;
  const recent = candles.slice(-30);
  const resistance = Math.max(...recent.map((c) => c.high));
  const support = Math.min(...recent.map((c) => c.low));
  return { price, emaFast, emaSlow, rsi: rsiVal, hist: histVal, histPrev, atr: atrVal, support, resistance, score };
}
function computeOverall(results) {
  let weighted = 0;
  TF_CONFIG.forEach((tf) => { weighted += results[tf.key].score * tf.weight; });
  const dirs = TF_CONFIG.map((tf) => Math.sign(results[tf.key].score));
  const agree = dirs.filter((d) => d === Math.sign(weighted) && d !== 0).length;
  return { score: weighted, confidence: Math.round((agree / TF_CONFIG.length) * 100) };
}
function computeSignal(results, overall, triggerKey, price) {
  const trig = results[triggerKey];
  const t4 = results["4h"].score, t1d = results["1day"].score;
  const higherAligned = Math.sign(t4) === Math.sign(t1d) && t4 !== 0;
  const macdRising = trig.hist > trig.histPrev;
  const macdFalling = trig.hist < trig.histPrev;
  let direction = "WAIT";
  if (overall.score >= 0.4 && higherAligned && t4 > 0 && trig.rsi < 70 && trig.hist > 0 && macdRising) direction = "BUY";
  else if (overall.score <= -0.4 && higherAligned && t4 < 0 && trig.rsi > 30 && trig.hist < 0 && macdFalling) direction = "SELL";

  const a0 = trig.atr || 0;
  if (direction === "BUY" && (trig.resistance - price) < a0) direction = "WAIT";
  if (direction === "SELL" && (price - trig.support) < a0) direction = "WAIT";

  if (direction === "WAIT") return { direction: "WAIT" };

  let stop, target, target2;
  if (direction === "BUY") {
    stop = price - a0 * 1.5;
    const dist = price - stop;
    target = price + dist * 2; target2 = price + dist * 3;
  } else {
    stop = price + a0 * 1.5;
    const dist = stop - price;
    target = price - dist * 2; target2 = price - dist * 3;
  }
  return { direction, stop, target, target2 };
}

// ---------- backtest engine ----------
function runBacktest(candleSets, triggerKey) {
  const trigCandles = candleSets[triggerKey];
  const trades = [];
  let i = 60; // need enough history for EMA50/RSI14 to stabilize
  let unresolved = 0;

  while (i < trigCandles.length) {
    const now = trigCandles[i].time;
    const results = {};
    let dataOk = true;
    for (const tf of TF_CONFIG) {
      const window = candleSets[tf.key].filter((c) => c.time <= now);
      if (window.length < 55) { dataOk = false; break; }
      results[tf.key] = analyzeCandles(window);
    }
    if (!dataOk) { i++; continue; }

    const overall = computeOverall(results);
    const price = trigCandles[i].close;
    const signal = computeSignal(results, overall, triggerKey, price);

    if (signal.direction === "WAIT") { i++; continue; }

    // Walk forward on the SAME trigger timeframe's candles to resolve the trade.
    // Conservative assumption: if both stop and TP appear touched within the
    // same candle, assume stop hit first (worst-case, avoids overstating results).
    let outcome = null, barsToResolve = 0;
    for (let j = i + 1; j < trigCandles.length; j++) {
      const c = trigCandles[j];
      barsToResolve++;
      if (signal.direction === "BUY") {
        const stopHit = c.low <= signal.stop;
        const tp1Hit = c.high >= signal.target;
        const tp2Hit = c.high >= signal.target2;
        if (stopHit) { outcome = "SL"; break; }
        if (tp2Hit) { outcome = "TP2"; break; }
        if (tp1Hit) { outcome = "TP1"; break; }
      } else {
        const stopHit = c.high >= signal.stop;
        const tp1Hit = c.low <= signal.target;
        const tp2Hit = c.low <= signal.target2;
        if (stopHit) { outcome = "SL"; break; }
        if (tp2Hit) { outcome = "TP2"; break; }
        if (tp1Hit) { outcome = "TP1"; break; }
      }
    }

    if (!outcome) { unresolved++; i++; continue; } // ran out of data before resolving

    const rMultiple = outcome === "SL" ? -1 : outcome === "TP1" ? 2 : 3;
    trades.push({ time: now, direction: signal.direction, outcome, rMultiple, barsToResolve });
    i = i + barsToResolve + 1; // no overlapping trades — resume after this one resolves
  }

  return { trades, unresolved };
}

function summarize(trades) {
  const wins = trades.filter(t => t.outcome !== "SL");
  const losses = trades.filter(t => t.outcome === "SL");
  const totalR = trades.reduce((s, t) => s + t.rMultiple, 0);
  const winRate = trades.length ? (wins.length / trades.length) * 100 : 0;
  const avgR = trades.length ? totalR / trades.length : 0;
  const avgBars = trades.length ? trades.reduce((s,t)=>s+t.barsToResolve,0) / trades.length : 0;
  return { total: trades.length, wins: wins.length, losses: losses.length, winRate, totalR, avgR, avgBars };
}

function ForexPulseBacktester() {
  const [apiKey, setApiKey] = useState("");
  const [showKey, setShowKey] = useState(false);
  const [symbol, setSymbol] = useState("EUR/USD");
  const [triggerKey, setTriggerKey] = useState("1h");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [result, setResult] = useState(null);

  const run = useCallback(async () => {
    if (!apiKey.trim()) { setError("Enter your Twelve Data API key first."); return; }
    setLoading(true); setError(""); setResult(null);
    try {
      const candleSets = {};
      for (const tf of TF_CONFIG) {
        const res = await fetch(`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(symbol)}&interval=${tf.key}&outputsize=${tf.points}&apikey=${encodeURIComponent(apiKey)}`);
        const json = await res.json();
        if (json.status === "error") throw new Error(`${tf.label}: ${json.message}`);
        candleSets[tf.key] = json.values.map(v => ({
          close: parseFloat(v.close), high: parseFloat(v.high), low: parseFloat(v.low), open: parseFloat(v.open),
          time: new Date(v.datetime).getTime(),
        })).reverse();
        if (candleSets[tf.key].length < 60) throw new Error(`${tf.label}: not enough historical data returned (got ${candleSets[tf.key].length}).`);
      }
      const { trades, unresolved } = runBacktest(candleSets, triggerKey);
      setResult({ trades, unresolved, summary: summarize(trades), dataSpan: {
        from: new Date(candleSets[triggerKey][60]?.time).toLocaleDateString(),
        to: new Date(candleSets[triggerKey][candleSets[triggerKey].length-1]?.time).toLocaleDateString(),
      }});
    } catch (e) {
      setError(e.message || "Backtest failed — check your API key or symbol.");
    } finally { setLoading(false); }
  }, [apiKey, symbol, triggerKey]);

  return (
    <div style={{minHeight:"100vh",padding:"20px 14px 60px"}}>
      <div style={{maxWidth:820,margin:"0 auto"}}>
        <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:4}}>
          <span style={{color:"#E8A33D",fontSize:20}}>◆</span>
          <h1 className="fp-display" style={{fontSize:24,fontWeight:700,margin:0}}>FX PULSE — BACKTESTER</h1>
        </div>
        <p style={{color:"#7C8798",fontSize:12.5,margin:"0 0 20px",maxWidth:640,lineHeight:1.5}}>
          Runs the exact same signal logic as the live tool against real historical data, walking forward
          candle-by-candle with no look-ahead — every signal only ever sees data available at that point in time.
          Resolution uses the trigger timeframe's own candles (not tick data), and assumes stop-hit-first when a
          candle touches both stop and target — a conservative bias, not an optimistic one.
        </p>

        <div className="fp-panel" style={{padding:16,marginBottom:18}}>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <input className="fp-input" placeholder="API key" type={showKey?"text":"password"} value={apiKey} onChange={e=>setApiKey(e.target.value)} style={{width:200}} />
              <button onClick={()=>setShowKey(s=>!s)} style={{background:"none",border:"none",cursor:"pointer",color:"#7C8798"}}>{showKey?"hide":"show"}</button>
            </div>
            <select className="fp-input" value={symbol} onChange={e=>setSymbol(e.target.value)} style={{width:160}}>
              <option value="EUR/USD">EUR/USD</option>
              <option value="XAU/USD">XAU/USD (Gold)</option>
              <option value="BTC/USD">BTC/USD (Bitcoin)</option>
            </select>
            <select className="fp-input" value={triggerKey} onChange={e=>setTriggerKey(e.target.value)} style={{width:120}}>
              <option value="15min">15M trigger</option>
              <option value="1h">1H trigger</option>
              <option value="4h">4H trigger</option>
            </select>
            <button className="fp-btn" onClick={run} disabled={loading}>{loading?"Running…":"Run Backtest"}</button>
          </div>
          <div style={{fontSize:11,color:"#5B6472",marginTop:8}}>
            Pulls up to 500 historical candles per timeframe (4 API calls total) — takes a few seconds.
          </div>
          {error && <div style={{marginTop:10,color:"#FF5C5C",fontSize:12.5}}>⚠ {error}</div>}
        </div>

        {result && (
          <>
            <div className="fp-panel" style={{padding:18,marginBottom:18}}>
              <div style={{fontSize:11,color:"#5B6472",marginBottom:10}}>
                Data span: {result.dataSpan.from} → {result.dataSpan.to} · Trigger: {triggerKey.toUpperCase()} · {symbol}
              </div>
              <div className="fp-grid" style={{display:"grid",gridTemplateColumns:"repeat(4, 1fr)",gap:14}}>
                <Stat label="Signals" value={result.summary.total} />
                <Stat label="Win rate" value={`${result.summary.winRate.toFixed(1)}%`} color={result.summary.winRate>=50?"#3DDC97":"#FF5C5C"} />
                <Stat label="Wins / Losses" value={`${result.summary.wins} / ${result.summary.losses}`} />
                <Stat label="Total R" value={`${result.summary.totalR>=0?"+":""}${result.summary.totalR.toFixed(1)}R`} color={result.summary.totalR>=0?"#3DDC97":"#FF5C5C"} />
                <Stat label="Avg R / trade" value={`${result.summary.avgR>=0?"+":""}${result.summary.avgR.toFixed(2)}R`} color={result.summary.avgR>=0?"#3DDC97":"#FF5C5C"} />
                <Stat label="Avg bars to resolve" value={result.summary.avgBars.toFixed(1)} />
                <Stat label="Unresolved (ran out of data)" value={result.unresolved} />
                <Stat label="At 0.5% risk, would've been" value={`${(result.summary.totalR*0.5).toFixed(2)}%`} color={result.summary.totalR>=0?"#3DDC97":"#FF5C5C"} />
              </div>
            </div>

            <div className="fp-panel" style={{padding:18}}>
              <div style={{fontSize:11,color:"#5B6472",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Trade log</div>
              <div style={{maxHeight:400,overflowY:"auto"}}>
                {result.trades.map((t,i) => (
                  <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"6px 0",borderBottom:"1px solid #1A1F27"}}>
                    <span style={{color:"#7C8798"}}>{new Date(t.time).toLocaleDateString()} {t.direction}</span>
                    <span style={{color: t.outcome==="SL"?"#FF5C5C":"#3DDC97",fontWeight:600}}>{t.outcome} ({t.rMultiple>=0?"+":""}{t.rMultiple}R, {t.barsToResolve} bars)</span>
                  </div>
                ))}
                {result.trades.length === 0 && <div style={{color:"#5B6472",fontSize:12}}>No signals fired in this data window.</div>}
              </div>
            </div>
          </>
        )}

        <p style={{fontSize:11,color:"#454C57",marginTop:26,lineHeight:1.6}}>
          Real limitations, stated plainly: free-tier history depth caps how far back this can see (roughly the
          last few weeks for 15M/1H, longer for 4H/1D). Past performance on this window doesn't guarantee future
          results — markets change regime. This only tests the main strategy, not the experimental scalp/range
          signals. Use this to sanity-check the approach, not as a guarantee.
        </p>
      </div>
    </div>
  );
}

function Stat({ label, value, color }) {
  return (
    <div>
      <div style={{fontSize:10.5,color:"#5B6472",marginBottom:4}}>{label}</div>
      <div className="fp-display" style={{fontSize:18,fontWeight:700,color: color || "#E9EDF3"}}>{value}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ForexPulseBacktester />);
</script>
</body>
</html>
